services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: starwars_challenge
      POSTGRES_USER: starwars
      POSTGRES_PASSWORD: starwars
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starwars -d starwars_challenge"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/starwars_challenge
      DB_USERNAME: starwars
      DB_PASSWORD: starwars
      JWT_SECRET: ${JWT_SECRET:-l8PGxqlcXRC3HZHK1EfF/bKAQVHHPacGq/cOvUC0QvIFLJW7kSQEhjuKBKM1tML9}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
